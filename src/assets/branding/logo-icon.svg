<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" role="img" aria-label="Dynamic Dashboard icon">
  <!-- ======================================================
       D-mark icon — Dynamic Dashboard
       Colors: dark navy #0D1939, blue #4B7BEC, purple #7C3AED,
               teal #2DD4BF, circuit-blue #3B82F6
  ====================================================== -->

  <!-- D letter outline — dark navy strokes -->
  <!-- Left vertical bar -->
  <rect x="24" y="22" width="13" height="116" rx="2" fill="#0D1939"/>
  <!-- Top horizontal bar -->
  <rect x="24" y="22" width="52" height="13" rx="2" fill="#0D1939"/>
  <!-- Bottom horizontal bar -->
  <rect x="24" y="125" width="52" height="13" rx="2" fill="#0D1939"/>
  <!-- Right curve of D (open semi-circle belly) -->
  <path d="M74,22 Q138,22 138,80 Q138,138 74,138" stroke="#0D1939" stroke-width="13" stroke-linecap="round" fill="none"/>

  <!-- Bar chart inside the D -->
  <!-- Bar 1 — teal, shortest -->
  <rect x="44" y="96" width="14" height="42" rx="2.5" fill="#2DD4BF"/>
  <!-- Bar 2 — dark navy/indigo -->
  <rect x="62" y="78" width="14" height="60" rx="2.5" fill="#1E3A8A"/>
  <!-- Bar 3 — brand blue -->
  <rect x="80" y="62" width="14" height="76" rx="2.5" fill="#4B7BEC"/>
  <!-- Bar 4 — purple, tallest -->
  <rect x="98" y="48" width="14" height="90" rx="2.5" fill="#7C3AED"/>

  <!-- 4-pointed sparkle star -->
  <path d="M105 42 L107.5 33 L110 42 L119 44.5 L110 47 L107.5 56 L105 47 L96 44.5 Z" fill="#7C3AED"/>

  <!-- Circuit trace lines extending left from the D's left bar -->
  <!-- Top trace (horizontal, with end node) -->
  <line x1="24" y1="60" x2="6"  y2="60" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="5" cy="60" r="4.5" fill="#3B82F6"/>

  <!-- Middle trace (L-bend going down then left) -->
  <line x1="16" y1="60" x2="16" y2="82" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="82" x2="6"  y2="82" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="5" cy="82" r="4.5" fill="#3B82F6"/>

  <!-- Bottom trace -->
  <line x1="24" y1="104" x2="6" y2="104" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="5" cy="104" r="4.5" fill="#3B82F6"/>
</svg>
