<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Dynamic Dashboard favicon">
  <!-- D-mark icon — favicon variant (simplified for small sizes) -->
  <!-- Dark navy rounded background (like the app icon shown in the brand sheet) -->
  <rect width="160" height="160" rx="28" fill="#0D1939"/>

  <!-- D letter — white strokes -->
  <rect x="28" y="26" width="12" height="108" rx="2" fill="#FFFFFF"/>
  <rect x="28" y="26" width="48" height="12" rx="2" fill="#FFFFFF"/>
  <rect x="28" y="122" width="48" height="12" rx="2" fill="#FFFFFF"/>
  <path d="M74,26 Q128,26 128,80 Q128,134 74,134" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Bars -->
  <rect x="46" y="94" width="13" height="40" rx="2" fill="#2DD4BF"/>
  <rect x="63" y="76" width="13" height="58" rx="2" fill="#4B7BEC"/>
  <rect x="80" y="60" width="13" height="74" rx="2" fill="#7C3AED"/>

  <!-- Sparkle -->
  <path d="M83 52 L85.5 43 L88 52 L97 54.5 L88 57 L85.5 66 L83 57 L74 54.5 Z" fill="#A78BFA"/>

  <!-- Circuit traces -->
  <line x1="28" y1="60" x2="12" y2="60" stroke="#6B98FF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="11" cy="60" r="4" fill="#6B98FF"/>
  <line x1="20" y1="60" x2="20" y2="80" stroke="#6B98FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="80" x2="12" y2="80" stroke="#6B98FF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="11" cy="80" r="4" fill="#6B98FF"/>
  <line x1="28" y1="100" x2="12" y2="100" stroke="#6B98FF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="11" cy="100" r="4" fill="#6B98FF"/>
</svg>
